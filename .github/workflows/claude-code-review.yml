name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  claude-review:
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md, then review this PR for must-fix issues only:
            - Bugs or logic errors
            - `INWHEEL_API_KEY`, `PAGE_PASSWORD`, or `SESSION_SECRET` reaching the client: a `NEXT_PUBLIC_`
              env var, a Client Component, a client bundle, or a response body. The API key is attached
              only inside Server Actions
            - Routes re-implementing their own auth check instead of relying on `src/proxy.ts`, or matcher
              changes that could leave a route that should be protected unprotected
            - Cookies without `httpOnly`, `secure` in production, and `sameSite`; session values not sealed
              via `iron-session`; raw passwords stored or compared outside `isCorrectPagePassword`
            - Accessibility PATCH payloads resubmitting a whole profile/section snapshot instead of only the
              fields the friend touched (RFC 7396 merge patch: omitted = untouched, `null` = cleared)
            - New Server Actions calling `inwheel-api` without validating/sanitizing input
            - New user-facing English strings: UI copy is French only
            - New exported functions, Server Actions, or components without unit or E2E tests for each
              meaningful branch, unless trivial pass-throughs

            Skip anything CI already enforces (ESLint, type checks, tests) and skip style, subjective, or
            hypothetical feedback.

            Post inline comments for must-fix issues, then one top-level summary — explicitly say "looks good"
            if there are none. Don't manufacture issues to appear thorough.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
